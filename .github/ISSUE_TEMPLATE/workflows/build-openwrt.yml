name: Build ImmortalWrt-WRT32X

on:
  workflow_dispatch:      # 页面手动运行按钮
#  repository_dispatch:
#  release:
#    types: published
#  push:
#    branches:
#      - master
#  schedule:
#    - cron: 0 8 * * 5
#  watch:
#    types: started

env:
  # 新版 ImmortalWrt 源码地址
  REPO_URL: https://github.com/whfweb/immortalwrt.git
  REPO_BRANCH: master

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/ssr.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  # 功能开关
  ssh: true
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: true
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false

  TZ: Asia/Shanghai
  DEVICE_TARGET: mvebu/cortexa9
  DEVICE_NAME: WRT32X

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout config files
      uses: actions/checkout@v4

    - name: Init compile environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get -qq update
        sudo apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-latest)
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone ImmortalWrt source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt --depth 1
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: DIY Part1 Load Feeds
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load .config & DIY Part2
      run: |
        [ -d files ] && cp -r files openwrt/
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: SSH debug connection
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download source packages
      id: dl_step
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -delete

    - name: Compile firmware
      id: build_step
      run: |
        cd openwrt
        echo "Compile threads: $(nproc)"
        make -j$(nproc) || make -j1 V=s
        echo "::set-output name=status::success"
        echo "BUILD_DATE=$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV

    - name: Check disk space
      if: success() || failure()
      run: df -hT

    - name: Upload full bin folder
      uses: actions/upload-artifact@v4
      if: steps.build_step.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ImmortalWrt_bin-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: openwrt/bin

    - name: Organize firmware files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && success()
      run: |
        FIRMWARE_PATH=openwrt/bin/targets/${DEVICE_TARGET}
        rm -rf ${FIRMWARE_PATH}/packages
        echo "FIRMWARE_DIR=${FIRMWARE_PATH}" >> $GITHUB_ENV
        echo "::set-output name=ok::1"

    - name: Upload firmware image only
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.ok == '1'
      with:
        name: ImmortalWrt_Firmware-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: ${{ env.FIRMWARE_DIR }}

    - name: Upload to Cowtransfer (CN fast download)
      id: cow
      if: steps.organize.outputs.ok == '1' && env.UPLOAD_COWTRANSFER == 'true'
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE_DIR} 2>&1 | tee cow.log
        echo "::warning file=cowtransfer::$(grep https cow.log)"
        echo "::set-output name=url::$(grep https cow.log | awk '{print $NF}')"

    - name: Clean old workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    # Release、WeTransfer 已关闭，相关步骤全部注释不执行
    # - name: Generate Release Tag
    # - name: Create Github Release
    # - name: Upload to WeTransfer
    # - name: Delete old releases
